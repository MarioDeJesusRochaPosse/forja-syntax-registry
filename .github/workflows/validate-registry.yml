name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests and queries
        run: python3 .github/scripts/validate-registry.py
      # Compila cada query contra el binario publicado de su gramática. Sin
      # esto, una query con tipos de nodo inexistentes (p. ej. `crate` en Rust)
      # pasa la validación de texto y rompe el resaltado en el editor.
      - name: Validate queries against published grammars
        run: cargo run --quiet --release --manifest-path tools/query-check/Cargo.toml
